name: Release offline file

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:single -w @casedrill/web
      - run: cp packages/web/dist-single/index.html casedrill.html
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            casedrill.html
            templates/casedrill-template.xml
          generate_release_notes: true
